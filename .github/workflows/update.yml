name: Update events
on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install beautifulsoup4 lxml
      - run: python scripts/update_events.py
      - name: Guardar cambios
        run: |
          git config user.name "sportcal-bot"
          git config user.email "sportcal-bot@users.noreply.github.com"
          git add app/src/main/assets/events.json
          git diff --cached --quiet || (git commit -m "Actualizar eventos" && git push)
